# Runs the full Windows time zone test on a clean GitHub-hosted Windows
# machine. Not part of the CPAN distribution: Dist::Zilla's [GatherDir]
# skips dot-directories such as .github.
name: Windows

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:    # "Run workflow" button on the Actions tab

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.42'
          distribution: strawberry

      # Latest DateTime::TimeZone from CPAN, so the test compares Windows
      # against the newest IANA data.
      - name: Install dependencies
        run: cpanm --notest DateTime DateTime::TimeZone Try::Tiny Win32::TieRegistry

      # Windows build and time zone data level next to the IANA data level,
      # so an offset failure shows whether this machine's Windows is behind.
      - name: Show versions
        run: |
          $cv = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          "Windows build: $($cv.CurrentBuild).$($cv.UBR)"
          $tzv = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Time Zones').TzVersion
          'Windows TzVersion: 0x{0:X8} (year {1}, release {2})' -f $tzv, ($tzv -shr 16), ($tzv -band 0xFFFF)
          # Single quotes so PowerShell leaves the $ variables for Perl.
          perl -MDateTime -MDateTime::TimeZone -e 'printf qq{Perl %vd, DateTime %s, DateTime::TimeZone %s (IANA %s)\n}, $^V, $DateTime::VERSION, $DateTime::TimeZone::VERSION, DateTime::TimeZone->new(name => q{America/Havana})->olson_version'

      # The runner is an administrator, so the registry-based checks run too.
      - name: Run full Windows time zone test
        env:
          AUTOMATED_TESTING: 1
          AUTHOR_TESTING: 1
        run: prove -lv t
